# This workflow is DISABLED.
# This project is deployed via Vercel, not GitHub Pages.
# The original nextjs.yml (GitHub Pages workflow) caused build failures
# because GitHub Pages was not enabled for this repository.
#
# Vercel auto-deploys on every push to main — no GitHub Actions needed.
#
# To re-enable GitHub Pages deployment in the future, restore the original
# workflow and enable Pages under:
#   Repository Settings → Pages → Source → GitHub Actions

name: "[DISABLED] Deploy Next.js site to Pages"

on:
  workflow_dispatch: # manual trigger only — will never run automatically
    inputs:
      confirm:
        description: "Type YES to confirm you want to run the disabled workflow"
        required: true

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow is disabled
        run: |
          echo "This workflow is disabled. The project is deployed via Vercel."
          exit 0
